<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 增加安全性：內容安全政策 (CSP) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.dictionaryapi.dev https://api.mymemory.translated.net;">
    <title>動詞三態字典表 - Verb Conjugation</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f9f9f9;
            --text-color: #333;
            --border-color: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        h1 {
            color: var(--primary-color);
            font-weight: 300;
            margin: 0;
            letter-spacing: 2px;
        }

        .toggle-group {
            display: flex;
            background: #eee;
            border-radius: 20px;
            padding: 4px;
        }

        .toggle-btn {
            border: none;
            padding: 8px 16px;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 600;
            background: transparent;
            color: #7f8c8d;
            transition: all 0.3s;
        }

        .toggle-btn.active {
            background: #fff;
            color: var(--accent-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background-color: #f8f9fa;
            color: #7f8c8d;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            padding: 15px;
            text-align: left;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        .word-cell, td:nth-child(2), td:nth-child(3), td:nth-child(4) {
            font-weight: 600;
            color: var(--primary-color);
            cursor: pointer;
            transition: background-color 0.2s;
        }

        td:hover:not(.meaning):not(:last-child) {
            background-color: #ebf5fb;
        }

        .ipa {
            display: block;
            font-size: 0.85rem;
            color: #7f8c8d;
            font-family: 'Arial', sans-serif;
            font-weight: normal;
        }
        
        /* 發音中文字變藍色 */
        .speaking {
            color: #007bff !important;
            text-shadow: 0 0 2px rgba(0, 123, 255, 0.3);
        }
        
        /* 分類標題行樣式 */
        .group-header {
            background-color: #f1f3f4;
            font-weight: bold;
            color: #5f6368;
            text-align: center;
        }

        .meaning {
            color: #16a085;
            font-weight: 500;
        }

        /* 圖示基礎樣式 */
        .icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
            display: inline-block;
            vertical-align: middle;
        }

        .btn-speak {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--accent-color);
            display: flex;
            padding: 5px;
            transition: transform 0.2s;
        }

        .btn-speak:hover {
            transform: scale(1.2);
        }

        tr:hover {
            background-color: #fcfcfc;
        }

        @media (max-width: 600px) {
            .container { padding: 15px; }
            th, td { padding: 10px 5px; font-size: 0.9rem; }
            .ipa { font-size: 0.75rem; } /* 手機版改為縮小字體而非完全隱藏 */
            .checkbox-cell { width: 30px; }
        }

        /* 批量管理樣式 */
        .checkbox-cell {
            width: 45px;
            text-align: center;
            vertical-align: middle;
        }
        #btn-confirm-delete {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            cursor: pointer;
            font-weight: bold;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }
        #btn-confirm-delete:hover { background-color: #c0392b; }

        /* 快速新增區塊樣式 - 增加高度並保持一整行 */
        .add-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            flex-wrap: wrap; /* 允許換行以容納更多欄位 */
            align-items: center;
        }

        .add-input-group {
            display: flex;
            flex: 5;
            gap: 10px;
            min-width: 0;
            align-items: center;
        }

        .add-bar input, .add-bar select {
            padding: 15px; /* 增加高度 */
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1.1rem; /* 字體加大 */
            outline: none;
            min-width: 0;
        }

        .add-bar input:focus {
            border-color: var(--accent-color);
        }
        
        #add-base { flex: 1; }
        #add-mean { flex: 2.5; }
        #add-ipa { flex: 2; }
        #add-type { flex: 0.8; }

        .btn-add {
            background: #27ae60;
            color: white;
            border: none;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.3s;
        }

        .btn-add:hover {
            background: #219150;
            transform: scale(1.1);
        }

        #btn-mic {
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            width: 45px;
            height: 45px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.3s;
        }

        #btn-mic.recording {
            background: #e74c3c;
            transform: scale(1.1);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-container">
        <h1>動詞變位單字表</h1>
        <div style="display: flex; gap: 10px; align-items: center;">
            <button id="btn-toggle-delete" class="toggle-btn" style="border: 1px solid var(--border-color); padding: 8px; display: flex; align-items: center; justify-content: center;" title="批量管理">
                <svg class="icon" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            </button>
            <div class="toggle-group">
                <button id="btn-us" class="toggle-btn active" title="美式發音">🇺🇸 US</button>
                <button id="btn-uk" class="toggle-btn" title="英式發音">🇬🇧 UK</button>
            </div>
        </div>
    </div>
    
    <!-- 快速新增功能區 -->
    <div class="add-bar">
        <div class="add-input-group">
            <input type="text" id="add-base" placeholder="輸入原型 ">
            <button id="btn-mic" title="語音輸入">
                <svg class="icon" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
            </button>
        </div>
        <input type="text" id="add-mean" placeholder="中文解釋...">
        <input type="text" id="add-ipa" placeholder="音標 (如: /hɜrt/)">
        <select id="add-type" title="選擇變化模式">
            <option value="A-B-B">A-B-B (常見)</option>
            <option value="A-B-C">A-B-C</option>
            <option value="A-A-A">A-A-A</option>
            <option value="A-B-A">A-B-A</option>
        </select>
        <button class="btn-add" id="btn-confirm-add" title="確認加入">➕</button>
    </div>

    <button id="btn-confirm-delete" title="執行刪除"></button>

    <table>
        <thead>
            <tr id="tableHeader">
                <th class="checkbox-cell" style="display: none;"><input type="checkbox" id="select-all"></th>
                <th>原型 (Base)</th>
                <th>過去式 (Past)</th>
                <th>過去分詞 (P.P.)</th>
                <th>現在分詞 (ing)</th>
                <th>中文解釋</th>
                <th title="發音">
                    <svg class="icon" style="width: 18px; height: 18px; color: #7f8c8d;" viewBox="0 0 24 24">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                    </svg>
                </th>
            </tr>
        </thead>
        <tbody id="verbTableBody">
            <!-- 動詞資料將由 JS 填充 -->
        </tbody>
    </table>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // 定義喇叭 SVG 模板
        const speakerIcon = `<svg class="icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>`;

        // 定義管理與取消圖示
        const manageIcon = `<svg class="icon" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>`;
        const cancelIcon = `<svg class="icon" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>`;

        const defaultVerbs = [
            // A-A-A 模式 (三態同形)
            { type: "A-A-A", mean: "切割", base: { us: ["cut", "/kʌt/"], uk: ["cut", "/kʌt/"] }, past: { us: ["cut", "/kʌt/"], uk: ["cut", "/kʌt/"] }, pp: { us: ["cut", "/kʌt/"], uk: ["cut", "/kʌt/"] }, ing: { us: ["cutting", "/ˈkʌtɪŋ/"], uk: ["cutting", "/ˈkʌtɪŋ/"] } },
            { type: "A-A-A", mean: "放置", base: { us: ["put", "/pʊt/"], uk: ["put", "/pʊt/"] }, past: { us: ["put", "/pʊt/"], uk: ["put", "/pʊt/"] }, pp: { us: ["put", "/pʊt/"], uk: ["put", "/pʊt/"] }, ing: { us: ["putting", "/ˈpʊtɪŋ/"], uk: ["putting", "/ˈpʊtɪŋ/"] } },
            { type: "A-A-A", mean: "花費", base: { us: ["cost", "/kɔst/"], uk: ["cost", "/kɒst/"] }, past: { us: ["cost", "/kɔst/"], uk: ["cost", "/kɒst/"] }, pp: { us: ["cost", "/kɔst/"], uk: ["cost", "/kɒst/"] }, ing: { us: ["costing", "/ˈkɔstɪŋ/"], uk: ["costing", "/ˈkɒstɪŋ/"] } },
            { type: "A-A-A", mean: "受傷/疼痛", base: { us: ["hurt", "/hɜrt/"], uk: ["hurt", "/hɜːt/"] }, past: { us: ["hurt", "/hɜrt/"], uk: ["hurt", "/hɜːt/"] }, pp: { us: ["hurt", "/hɜrt/"], uk: ["hurt", "/hɜːt/"] }, ing: { us: ["hurting", "/ˈhɜrtɪŋ/"], uk: ["hurting", "/ˈhɜːtɪŋ/"] } },
            { type: "A-A-A", mean: "打擊/點擊", base: { us: ["hit", "/hɪt/"], uk: ["hit", "/hɪt/"] }, past: { us: ["hit", "/hɪt/"], uk: ["hit", "/hɪt/"] }, pp: { us: ["hit", "/hɪt/"], uk: ["hit", "/hɪt/"] }, ing: { us: ["hitting", "/ˈhɪtɪŋ/"], uk: ["hitting", "/ˈhɪtɪŋ/"] } },
            
            // A-A-B 模式 (原型與過去式相同)
            { type: "A-A-B", mean: "敲擊/打敗", base: { us: ["beat", "/bit/"], uk: ["beat", "/biːt/"] }, past: { us: ["beat", "/bit/"], uk: ["beat", "/biːt/"] }, pp: { us: ["beaten", "/ˈbitn/"], uk: ["beaten", "/ˈbiːtn/"] }, ing: { us: ["beating", "/ˈbitɪŋ/"], uk: ["beating", "/ˈbiːtɪŋ/"] } },

            // A-B-B 模式 (過去式與過去分詞相同)
            { type: "A-B-B", mean: "購買", base: { us: ["buy", "/baɪ/"], uk: ["buy", "/baɪ/"] }, past: { us: ["bought", "/bɔt/"], uk: ["bought", "/bɔːt/"] }, pp: { us: ["bought", "/bɔt/"], uk: ["bought", "/bɔːt/"] }, ing: { us: ["buying", "/ˈbaɪɪŋ/"], uk: ["buying", "/ˈbaɪɪŋ/"] } },
            { type: "A-B-B", mean: "保持", base: { us: ["keep", "/kip/"], uk: ["keep", "/kiːp/"] }, past: { us: ["kept", "/kɛpt/"], uk: ["kept", "/kɛpt/"] }, pp: { us: ["kept", "/kɛpt/"], uk: ["kept", "/kɛpt/"] }, ing: { us: ["keeping", "/ˈkipɪŋ/"], uk: ["keeping", "/ˈkiːpɪŋ/"] } },
            { type: "A-B-B", mean: "尋找", base: { us: ["find", "/faɪnd/"], uk: ["find", "/faɪnd/"] }, past: { us: ["found", "/faʊnd/"], uk: ["found", "/faʊnd/"] }, pp: { us: ["found", "/faʊnd/"], uk: ["found", "/faʊnd/"] }, ing: { us: ["finding", "/ˈfaɪndɪŋ/"], uk: ["finding", "/ˈfaɪndɪŋ/"] } },
            { type: "A-B-B", mean: "告訴", base: { us: ["tell", "/tɛl/"], uk: ["tell", "/tɛl/"] }, past: { us: ["told", "/toʊld/"], uk: ["told", "/təʊld/"] }, pp: { us: ["told", "/toʊld/"], uk: ["told", "/təʊld/"] }, ing: { us: ["telling", "/ˈtɛlɪŋ/"], uk: ["telling", "/ˈtɛlɪŋ/"] } },
            { type: "A-B-B", mean: "思考", base: { us: ["think", "/θɪŋk/"], uk: ["think", "/θɪŋk/"] }, past: { us: ["thought", "/θɔt/"], uk: ["thought", "/θɔːt/"] }, pp: { us: ["thought", "/θɔt/"], uk: ["thought", "/θɔːt/"] }, ing: { us: ["thinking", "/ˈθɪŋkɪŋ/"], uk: ["thinking", "/ˈθɪŋkɪŋ/"] } },

            // A-B-A 模式 (原型與過去分詞相同)
            { type: "A-B-A", mean: "跑", base: { us: ["run", "/rʌn/"], uk: ["run", "/rʌn/"] }, past: { us: ["ran", "/ræn/"], uk: ["ran", "/ræn/"] }, pp: { us: ["run", "/rʌn/"], uk: ["run", "/rʌn/"] }, ing: { us: ["running", "/ˈrʌnɪŋ/"], uk: ["running", "/ˈrʌnɪŋ/"] } },
            { type: "A-B-A", mean: "成為", base: { us: ["become", "/bɪˈkʌm/"], uk: ["become", "/bɪˈkʌm/"] }, past: { us: ["became", "/bɪˈkeɪm/"], uk: ["became", "/bɪˈkeɪm/"] }, pp: { us: ["become", "/bɪˈkʌm/"], uk: ["become", "/bɪˈkʌm/"] }, ing: { us: ["becoming", "/bɪˈkʌmɪŋ/"], uk: ["becoming", "/bɪˈkʌmɪŋ/"] } },
            { type: "A-B-A", mean: "來", base: { us: ["come", "/kʌm/"], uk: ["come", "/kʌm/"] }, past: { us: ["came", "/keɪm/"], uk: ["came", "/keɪm/"] }, pp: { us: ["come", "/kʌm/"], uk: ["come", "/kʌm/"] }, ing: { us: ["coming", "/ˈkʌmɪŋ/"], uk: ["coming", "/ˈkʌmɪŋ/"] } },

            // A-B-C 模式 (三態皆不同形)
            { type: "A-B-C", mean: "去", base: { us: ["go", "/ɡoʊ/"], uk: ["go", "/ɡəʊ/"] }, past: { us: ["went", "/wɛnt/"], uk: ["went", "/wɛnt/"] }, pp: { us: ["gone", "/ɡɔːn/"], uk: ["gone", "/ɡɒn/"] }, ing: { us: ["going", "/ˈɡoʊɪŋ/"], uk: ["going", "/ˈɡəʊɪŋ/"] } },
            { type: "A-B-C", mean: "吃", base: { us: ["eat", "/it/"], uk: ["eat", "/iːt/"] }, past: { us: ["ate", "/eɪt/"], uk: ["ate", "/et/"] }, pp: { us: ["eaten", "/ˈitn/"], uk: ["eaten", "/ˈiːtn/"] }, ing: { us: ["eating", "/ˈitɪŋ/"], uk: ["eating", "/ˈiːtɪŋ/"] } },
            { type: "A-B-C", mean: "拿", base: { us: ["take", "/teɪk/"], uk: ["take", "/teɪk/"] }, past: { us: ["took", "/tʊk/"], uk: ["took", "/tʊk/"] }, pp: { us: ["taken", "/ˈteɪkən/"], uk: ["taken", "/ˈteɪkən/"] }, ing: { us: ["taking", "/ˈteɪkɪŋ/"], uk: ["taking", "/ˈteɪkɪŋ/"] } },
            { type: "A-B-C", mean: "寫", base: { us: ["write", "/raɪt/"], uk: ["write", "/raɪt/"] }, past: { us: ["wrote", "/roʊt/"], uk: ["wrote", "/rəʊt/"] }, pp: { us: ["written", "/ˈrɪtn/"], uk: ["written", "/ˈrɪtn/"] }, ing: { us: ["writing", "/ˈrɪtɪŋ/"], uk: ["writing", "/ˈrɪtɪŋ/"] } },
            { type: "A-B-C", mean: "打破", base: { us: ["break", "/breɪk/"], uk: ["break", "/breɪk/"] }, past: { us: ["broke", "/broʊk/"], uk: ["broke", "/brəʊk/"] }, pp: { us: ["broken", "/ˈbroʊkən/"], uk: ["broken", "/ˈbrəʊkən/"] }, ing: { us: ["breaking", "/ˈbreɪkɪŋ/"], uk: ["breaking", "/ˈbreɪkɪŋ/"] } },
            { type: "A-B-C", mean: "開始", base: { us: ["begin", "/bɪˈɡɪn/"], uk: ["begin", "/bɪˈɡɪn/"] }, past: { us: ["began", "/bɪˈɡæn/"], uk: ["began", "/bɪˈɡæn/"] }, pp: { us: ["begun", "/bɪˈɡʌn/"], uk: ["begun", "/bɪˈɡʌn/"] }, ing: { us: ["beginning", "/bɪˈɡɪnɪŋ/"], uk: ["beginning", "/bɪˈɡɪnɪŋ/"] } }
        ];

        // 從本地儲存讀取自定義單字
        let customVerbs = JSON.parse(localStorage.getItem('customVerbs')) || [];
        let hiddenDefaultIds = JSON.parse(localStorage.getItem('hiddenDefaultIds')) || [];
        let isDeleteMode = false;

        const tableBody = document.getElementById('verbTableBody');
        const btnToggleDelete = document.getElementById('btn-toggle-delete');
        const btnConfirmDelete = document.getElementById('btn-confirm-delete');
        const btnUs = document.getElementById('btn-us');
        const btnUk = document.getElementById('btn-uk');
        const btnMic = document.getElementById('btn-mic');
        const addBase = document.getElementById('add-base');
        const addMean = document.getElementById('add-mean');
        const addIpa = document.getElementById('add-ipa');
        const addType = document.getElementById('add-type');
        const btnConfirmAdd = document.getElementById('btn-confirm-add');
        
        let autoFillTimeout;
        let autoFetchedIpas = {
            past: { us: "", uk: "" },
            ing: { us: "", uk: "" }
        };

        // 強化版智慧規則預測 - 移至外部以便共用
        const predictForms = (word) => {
            let past = word + "ed";
            let ing = word + "ing";

            if (word.endsWith('e')) {
                past = word + "d";
                ing = word.slice(0, -1) + "ing";
            } else if (word.match(/[bcdfghjklmnpqrstvwxyz][aeiou][bcdfghjklmnpqrstvwxyz]$/)) {
                // 重複字尾規則 (如 stop -> stopped)
                const lastChar = word.slice(-1);
                if (!['y','w','x'].includes(lastChar)) {
                    past = word + lastChar + "ed";
                    ing = word + lastChar + "ing";
                }
            } else if (word.endsWith('y') && !/[aeiou]y$/.test(word)) {
                // 子音+y 規則 (如 study -> studied)
                past = word.slice(0, -1) + "ied";
            }
            return { past, ing };
        };

        // 根據發音規則合成音標 (通靈 Fallback 邏輯)
        const generateDerivedIpa = (baseIpa, suffixType) => {
            if (!baseIpa) return "";
            let cleanIpa = baseIpa.replace(/\//g, '').trim();
            if (!cleanIpa) return "";

            if (suffixType === 'ing') return `/${cleanIpa}ɪŋ/`;
            
            if (suffixType === 'ed') {
                // 規則 1: t 或 d 結尾 -> 發 /ɪd/
                if (cleanIpa.endsWith('t') || cleanIpa.endsWith('d')) return `/${cleanIpa}ɪd/`;
                // 規則 2: 無聲子音結尾 -> 發 /t/
                const voiceless = ['p', 'k', 'f', 'θ', 's', 'ʃ', 'tʃ'];
                if (voiceless.some(v => cleanIpa.endsWith(v))) return `/${cleanIpa}t/`;
                // 規則 3: 其餘 -> 發 /d/
                return `/${cleanIpa}d/`;
            }
            return "";
        };

        // 輔助函式：從 API 抓取特定單字的音標 (邏輯保持不變)
        const fetchIpaFromApi = async (word) => {
            try {
                const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
                if (response.ok) {
                    const data = await response.json();
                    const entry = data[0];
                    let usIpa = "", ukIpa = "";
                    if (entry.phonetics && entry.phonetics.length > 0) {
                        const usEntry = entry.phonetics.find(p => p.audio?.includes('-us') || p.sourceUrl?.includes('cambridge'));
                        const ukEntry = entry.phonetics.find(p => p.audio?.includes('-uk') || !p.audio);
                        usIpa = (usEntry?.text || entry.phonetic || "").replace(/\//g, '');
                        ukIpa = (ukEntry?.text || entry.phonetic || "").replace(/\//g, '');
                    }
                    return { us: usIpa, uk: ukIpa };
                }
            } catch (e) { console.log("IPA fetch failed"); }
            return { us: "", uk: "" };
        };

        // 自動填寫功能：將邏輯獨立出來，方便「打字」與「語音」都能觸發
        const performAutoFill = async () => {
            const val = addBase.value.trim().toLowerCase();
            if (val.length < 2) return; // 長度太短不觸發

            const allVerbs = [...defaultVerbs, ...customVerbs];
            const found = allVerbs.find(v => 
                v.base.us[0].toLowerCase() === val || 
                v.base.uk[0].toLowerCase() === val
            );

            if (found) {
                addMean.value = found.mean;
                
                // 安全檢查：確保音標存在才執行 replace
                const usIpa = found.base.us[1] || "";
                const ukIpa = found.base.uk[1] || "";
                addIpa.value = (usIpa || ukIpa).replace(/\//g, '');
                
                autoFetchedIpas.past = { 
                    us: (found.past.us[1] || "").replace(/\//g, ''), 
                    uk: (found.past.uk[1] || "").replace(/\//g, '') 
                };
                autoFetchedIpas.ing = { 
                    us: (found.ing.us[1] || "").replace(/\//g, ''), 
                    uk: (found.ing.uk[1] || "").replace(/\//g, '') 
                };
                addType.value = found.type;
                
                [addMean, addIpa, addType].forEach(el => {
                    el.style.backgroundColor = '#e8f0fe';
                    setTimeout(() => el.style.backgroundColor = '', 500);
                });
                return; // 找到本地資料就結束
            }

            // --- 通靈模式：若本地找不到，則嘗試從 API 抓取音標 ---
            clearTimeout(autoFillTimeout);
            autoFillTimeout = setTimeout(async () => {
                const { past: predictedPast, ing: predictedIng } = predictForms(val);
                
                // 1. 同步抓取原型、預測過去式與 ing 的音標
                const [baseIpa, pastIpa, ingIpa] = await Promise.all([
                    fetchIpaFromApi(val),
                    fetchIpaFromApi(predictedPast),
                    fetchIpaFromApi(predictedIng)
                ]);

                addIpa.value = baseIpa.us || baseIpa.uk || "";
                
                autoFetchedIpas.past = pastIpa;
                autoFetchedIpas.ing = ingIpa;
                
                // 預測模式設為 A-B-B (最常見)
                addType.value = "A-B-B";

                // 成功抓取的視覺回饋
                if (addIpa.value) {
                    addIpa.style.backgroundColor = '#d1f2eb';
                    setTimeout(() => addIpa.style.backgroundColor = '', 800);
                }

                // 2. 自動翻譯 (通靈中文解釋)
                try {
                    const transRes = await fetch(`https://api.mymemory.translated.net/get?q=${val}&langpair=en|zh-TW`);
                    if (transRes.ok) {
                        const data = await transRes.json();
                        const translation = data.responseData.translatedText;
                        if (translation && translation !== val) {
                            addMean.value = translation;
                            addMean.style.backgroundColor = '#d1f2eb';
                            setTimeout(() => addMean.style.backgroundColor = '', 800);
                        }
                    }
                } catch (e) { console.log("翻譯 API 失敗"); }

            }, 800); // 停止打字 0.8 秒後觸發 API 查詢
        };
        
        // 監聽鍵盤輸入事件
        addBase.addEventListener('input', performAutoFill);

        let currentLang = 'us'; // 'us' or 'uk'
        
        // 語音播放功能優化
        const speak = (text, element) => {
            if (!('speechSynthesis' in window)) {
                alert("抱歉，您的瀏覽器不支援語音合成功能。");
                return;
            }
            
            // 先停止當前正在播放的語音，這能解決多數「聽不到」的掛起問題
            window.speechSynthesis.cancel();
            
            // 移除所有目前的發音中標記
            document.querySelectorAll('.speaking').forEach(el => el.classList.remove('speaking'));

            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = currentLang === 'us' ? 'en-US' : 'en-GB';
            msg.rate = 0.85; // 稍微調慢一點點，更方便記憶
            msg.volume = 1;
            
            if (element) {
                msg.onstart = () => element.classList.add('speaking');
                msg.onend = () => element.classList.remove('speaking');
                msg.onerror = () => element.classList.remove('speaking');
            }
            
            window.speechSynthesis.speak(msg);
        };

        // 渲染表格
        const renderTable = (filter = '') => {
            tableBody.innerHTML = '';
            
            // 輔助函式：判斷音標是否有有效內容
            const getIpaHtml = (ipa) => {
                if (typeof ipa !== 'string') return '';
                const trimmed = ipa.trim();
                return (!trimmed || trimmed === "" || trimmed === "/ /") ? '' : `<span class="ipa">${trimmed}</span>`;
            };

            const query = filter.toLowerCase().trim();
            
            // 合併內建與自定義單字
            const allVerbs = [
                ...defaultVerbs.filter(v => !hiddenDefaultIds.includes(v.base.us[0])),
                ...customVerbs
            ];

            const groupOrder = ["A-A-A", "A-A-B", "A-B-B", "A-B-A", "A-B-C"];
            
            // 更新表頭勾選框顯示
            document.querySelector('.checkbox-cell').style.display = isDeleteMode ? 'table-cell' : 'none';

            groupOrder.forEach(groupType => {
                // 先過濾符合搜尋條件的單字
                const groupVerbs = allVerbs.filter(v => {
                    if (v.type !== groupType) return false;
                    if (!query) return true;
                    
                    return v.mean.includes(query) || 
                           v.base[currentLang][0].toLowerCase().includes(query) ||
                           v.past[currentLang][0].toLowerCase().includes(query) ||
                           v.pp[currentLang][0].toLowerCase().includes(query) ||
                           v.ing[currentLang][0].toLowerCase().includes(query);
                });

                if (groupVerbs.length === 0) return;

                // 根據當前語言的單字拼寫進行 A-Z 排序
                groupVerbs.sort((a, b) => a.base[currentLang][0].localeCompare(b.base[currentLang][0]));

                // 加入分類模式標題行
                const headerRow = document.createElement('tr');
                const colspan = isDeleteMode ? 7 : 6;
                headerRow.innerHTML = `<td colspan="${colspan}" class="group-header">${groupType} 模式</td>`;
                tableBody.appendChild(headerRow);

                groupVerbs.forEach(v => {
                    const data = {
                        base: v.base[currentLang],
                        past: v.past[currentLang],
                        pp: v.pp[currentLang],
                        ing: v.ing[currentLang]
                    };
                    const verbId = v.id || v.base.us[0];
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="checkbox-cell" style="display: ${isDeleteMode ? 'table-cell' : 'none'};">
                            <input type="checkbox" class="verb-checkbox" data-id="${verbId}">
                        </td>
                        <td class="word-cell" data-speak="${data.base[0]}">${data.base[0]}${getIpaHtml(data.base[1])}</td>
                        <td data-speak="${data.past[0]}">${data.past[0]}${getIpaHtml(data.past[1])}</td>
                        <td data-speak="${data.pp[0]}">${data.pp[0]}${getIpaHtml(data.pp[1])}</td>
                        <td data-speak="${data.ing[0]}">${data.ing[0]}${getIpaHtml(data.ing[1])}</td>
                        <td class="meaning">${v.mean}</td>
                        <td>
                            <div style="display: flex; gap: 5px; align-items: center;">
                                <button class="btn-speak" data-speak="${data.base[0]}, ${data.past[0]}, ${data.pp[0]}" title="發音">${speakerIcon}</button>
                            </div>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            });
        };

        // 新增單字邏輯
        btnConfirmAdd.addEventListener('click', () => {
            const base = addBase.value.trim();
            const mean = addMean.value.trim();
            const type = addType.value;

            // 輔助函式：自動幫音標加上斜線 / /
            const formatIpa = (val) => {
                val = val.trim();
                if (!val) return "";
                if (!val.startsWith('/')) val = '/' + val;
                if (!val.endsWith('/')) val = val + '/';
                return val;
            };

            const ipaValue = formatIpa(addIpa.value);

            if (!base || !mean) {
                alert("請填寫單字與中文解釋");
                return;
            }

            // 智慧預測內容
            const regular = base.endsWith('e') ? base + 'd' : base + 'ed';
            const ing = base.endsWith('e') ? base.slice(0, -1) + 'ing' : base + 'ing';
            
            let past = regular, pp = regular;
            if (type === 'A-A-A') { past = base; pp = base; }
            else if (type === 'A-B-A') { pp = base; }

            const newVerb = {
                id: Date.now(), // 唯一 ID 用於刪除
                isCustom: true,
                type: type,
                mean: mean,
                base: { us: [base, ipaValue], uk: [base, ipaValue] },
                past: { us: [past, (type === 'A-A-A' ? ipaValue : "")], uk: [past, (type === 'A-A-A' ? ipaValue : "")] },
                pp: { us: [pp, (type === 'A-A-A' || type === 'A-B-A' ? ipaValue : "")], uk: [pp, (type === 'A-A-A' || type === 'A-B-A' ? ipaValue : "")] },
                ing: { us: [ing, ""], uk: [ing, ""] }
            };

            customVerbs.push(newVerb);
            localStorage.setItem('customVerbs', JSON.stringify(customVerbs));
            renderTable();
            
            // 重置輸入框
            addBase.value = '';
            addMean.value = '';
            addIpa.value = '';
            autoFetchedIpas = { past: { us: "", uk: "" }, ing: { us: "", uk: "" } };
        });

        // 語音辨識功能
        const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (Recognition) {
            const recognition = new Recognition();
            recognition.lang = 'en-US'; // 預設辨識英文
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => btnMic.classList.add('recording');
            recognition.onend = () => btnMic.classList.remove('recording');
            
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                addBase.value = transcript.replace('.', ''); // 語音轉文字後填入原型框
                performAutoFill(); // 手動觸發自動填寫，修正語音輸入沒反應的問題
            };

            btnMic.addEventListener('click', () => {
                try {
                    recognition.start();
                } catch (e) {
                    recognition.stop();
                }
            });
        } else {
            btnMic.style.display = 'none';
            console.warn("瀏覽器不支援語音辨識");
        }

        // 事件監聽：切換語系
        btnUs.addEventListener('click', () => {
            currentLang = 'us';
            btnUs.classList.add('active');
            btnUk.classList.remove('active');
            renderTable();
        });

        btnUk.addEventListener('click', () => {
            currentLang = 'uk';
            btnUk.classList.add('active');
            btnUs.classList.remove('active');
            renderTable();
        });

        // 批量管理邏輯
        btnToggleDelete.addEventListener('click', () => {
            isDeleteMode = !isDeleteMode;
            btnToggleDelete.classList.toggle('active');
            btnToggleDelete.innerHTML = isDeleteMode ? cancelIcon : manageIcon;
            btnToggleDelete.title = isDeleteMode ? '取消管理' : '批量管理';
            document.querySelector('table').classList.toggle('delete-mode', isDeleteMode);
            btnConfirmDelete.style.display = isDeleteMode ? 'flex' : 'none';
            btnConfirmDelete.innerHTML = `${manageIcon} (0)`;
            renderTable();
        });

        // 更新選中計數
        tableBody.addEventListener('change', (e) => {
            if (e.target.classList.contains('verb-checkbox')) {
                const count = document.querySelectorAll('.verb-checkbox:checked').length;
                btnConfirmDelete.innerHTML = `${manageIcon} (${count})`;
            }
        });

        // 全選功能
        document.getElementById('select-all').addEventListener('change', (e) => {
            const checkboxes = document.querySelectorAll('.verb-checkbox');
            checkboxes.forEach(cb => cb.checked = e.target.checked);
            const count = document.querySelectorAll('.verb-checkbox:checked').length;
            btnConfirmDelete.innerHTML = `${manageIcon} (${count})`;
        });

        btnConfirmDelete.addEventListener('click', () => {
            const checked = document.querySelectorAll('.verb-checkbox:checked');
            const idsToDelete = Array.from(checked).map(cb => cb.getAttribute('data-id'));
            
            if (idsToDelete.length === 0) {
                alert("請先勾選要刪除的單字");
                return;
            }

            if (confirm(`確定要刪除選中的 ${idsToDelete.length} 個單字嗎？`)) {
                // 從自定義單字中移除
                customVerbs = customVerbs.filter(v => !idsToDelete.includes(v.id?.toString()));
                
                // 從預設單字中隱藏 (ID 是原型字串)
                idsToDelete.forEach(id => {
                    const isDefault = defaultVerbs.some(dv => dv.base.us[0] === id);
                    if (isDefault && !hiddenDefaultIds.includes(id)) {
                        hiddenDefaultIds.push(id);
                    }
                });

                localStorage.setItem('customVerbs', JSON.stringify(customVerbs));
                localStorage.setItem('hiddenDefaultIds', JSON.stringify(hiddenDefaultIds));
                
                isDeleteMode = false;
                btnToggleDelete.innerHTML = manageIcon;
                btnToggleDelete.title = '批量管理';
                btnConfirmDelete.style.display = 'none';
                document.getElementById('select-all').checked = false;
                renderTable();
            }
        });

        // 事件委派：監聽點擊發音
        tableBody.addEventListener('click', (e) => {
            const clickable = e.target.closest('[data-speak]');
            if (clickable) {
                const textToSpeak = clickable.getAttribute('data-speak');
                speak(textToSpeak, clickable);
                return;
            }
        });

        // 初始渲染
        renderTable();
    });
</script>

</body>
