<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 增加安全性：內容安全政策 (CSP) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://api.dictionaryapi.dev https://api.mymemory.translated.net;">
    <title>動詞三態字典表 - Verb Conjugation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="header-container">
        <h1>動詞變位單字表</h1>
        <div class="header-controls">
            <button id="btn-toggle-delete" class="toggle-btn btn-manage" title="批量管理">
                <svg class="icon" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            </button>
            <div class="toggle-group">
                <button id="btn-us" class="toggle-btn active" title="美式發音">🇺🇸 US</button>
                <button id="btn-uk" class="toggle-btn" title="英式發音">🇬🇧 UK</button>
            </div>
        </div>
    </div>
    
    <!-- 快速新增功能區 -->
    <div class="add-bar">
        <div class="add-input-group">
            <input type="text" id="add-base" placeholder="輸入原型 ">
            <button id="btn-mic" title="語音輸入">
                <svg class="icon" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
            </button>
        </div>
        <input type="text" id="add-mean" placeholder="中文解釋...">
        <input type="text" id="add-ipa" placeholder="音標 (如: /hɜrt/)">
        <select id="add-type" title="選擇變化模式">
            <option value="A-B-B">A-B-B (常見)</option>
            <option value="A-B-C">A-B-C</option>
            <option value="A-A-A">A-A-A</option>
            <option value="A-B-A">A-B-A</option>
        </select>
        <button class="btn-add" id="btn-confirm-add" title="確認加入">➕</button>
    </div>

    <button id="btn-confirm-delete" class="btn-confirm-delete" title="執行刪除"></button>

    <table>
        <thead>
            <tr id="tableHeader">
                <th class="checkbox-cell"><input type="checkbox" id="select-all"></th>
                <th>原型 (Base)</th>
                <th>過去式 (Past)</th>
                <th>過去分詞 (P.P.)</th>
                <th>現在分詞 (ing)</th>
                <th>中文解釋</th>
                <th title="發音">
                    <svg class="icon" style="width: 18px; height: 18px; color: #7f8c8d;" viewBox="0 0 24 24">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                    </svg>
                </th>
            </tr>
        </thead>
        <tbody id="verbTableBody">
            <!-- 動詞資料將由 JS 填充 -->
        </tbody>
    </table>
</div>

<script src="script.js"></script>
</body>
</html>
